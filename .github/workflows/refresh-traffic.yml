name: refresh traffic numbers

# The traffic API keeps only fourteen days, so the table has to be rewritten
# before its window slides out from under it. It also requires push access to
# each repository, which the default GITHUB_TOKEN does not have for anything
# but this one - hence a PAT in TRAFFIC_TOKEN.
#
# Without that secret the job does not fail silently: it appends a line to the
# README saying when the numbers were last verified, so a stale table announces
# itself instead of pretending to be current.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # This page quotes numbers that live in other repositories. It once advertised
  # results that the repository in question had already withdrawn, because nothing
  # checked across the boundary. This job only reads, needs no secret, and runs on
  # pushes as well as on the schedule - the refresh below must stay on the schedule,
  # since without TRAFFIC_TOKEN it would mark the page stale on every push.
  quoted-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_quoted_numbers.py

      # The other half of the page describes what other people did with the work:
      # merged, open, closed. That state lives in their repositories and changes
      # without telling me. GITHUB_TOKEN is the automatic one, used only to raise
      # the anonymous rate limit on public reads.
      - name: claims about other people's repositories still hold
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_upstream_state.py

  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: rewrite the table from the traffic API
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "no TRAFFIC_TOKEN; marking the table as unverified instead"
            python scripts/refresh_traffic.py --mark-stale
          else
            python scripts/refresh_traffic.py
          fi

      - name: commit if anything moved
        run: |
          git config user.name "Guo Cheng"
          git config user.email "224264187+GuoCheng24@users.noreply.github.com"
          git diff --quiet || { git commit -am "Refresh the traffic numbers"; git push; }
